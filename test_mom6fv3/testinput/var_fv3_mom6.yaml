cost function:
  cost type: 3D-Var
  time window:
    begin: 2020-12-14T18:00:00Z
    length: PT6H
  geometry: &geom
    FV3JEDI:
      fms initialization:
        namelist filename: Data/fv3files/input_gfs_c12.nml
        field table filename: Data/fv3files/field_table_gmao
      akbk: Data/inputs/fv3files/akbk127.nc4
      npx: 13
      npy: 13
      npz: 127
      field metadata override: Data/fieldsets/gfs-restart.yaml
      #fieldsets:
      #  - fieldset: Data/fieldsets/dynamics.yaml
    SOCA:
      mom6_input_nml: ./inputnml/input.nml
      fields metadata: ./fields_metadata_coupled.yml
    FV3JEDI exclude variables:
    - skin_temperature_at_surface_where_sea
    - sea_surface_height_above_geoid
    - sea_water_cell_thickness
    - sea_water_potential_temperature
    - sea_water_salinity
  analysis variables:
  - eastward_wind
  - northward_wind
  - air_temperature
  - air_pressure_thickness
  - water_vapor_mixing_ratio_wrt_moist_air
  - cloud_liquid_ice
  - cloud_liquid_water
  - ozone_mass_mixing_ratio
  - sea_water_salinity
  - sea_water_potential_temperature
  background:
    FV3JEDI:
      datetime: 2020-12-14T21:00:00Z
      filetype: fms restart
      datapath: Data/inputs/gfs_c12/bkg/
      filename_core: 20201214.210000.fv_core.res.nc
      filename_trcr: 20201214.210000.fv_tracer.res.nc
      filename_sfcd: 20201214.210000.sfc_data.nc
      filename_sfcw: 20201214.210000.fv_srf_wnd.res.nc
      filename_cplr: 20201214.210000.coupler.res
      state variables:
      - eastward_wind
      - northward_wind
      - air_temperature
      - air_pressure_thickness
      - water_vapor_mixing_ratio_wrt_moist_air
      - cloud_liquid_ice
      - cloud_liquid_water
      - ozone_mass_mixing_ratio
      - geopotential_at_surface
      - slmsk
      - sheleg
      - skin_temperature_at_surface
      - vtype
      - stype
      - vfrac
      - stc
      - soilMoistureVolumetric
      - totalSnowDepth
      - eastward_wind_at_surface
      - northward_wind_at_surface
      - ratio_of_wind_at_surface_adjacent_layer_to_wind_at_10m
      field io names: &field_io_names
        eastward_wind: ua
        northward_wind: va
        air_temperature: T
        air_pressure_thickness: delp
        water_vapor_mixing_ratio_wrt_moist_air: sphum
        cloud_liquid_ice: ice_wat
        cloud_liquid_water: liq_wat
        ozone_mass_mixing_ratio: o3mr
        geopotential_at_surface: phis
        skin_temperature_at_surface: tsea
        soilMoistureVolumetric: smc
        totalSnowDepth: snwdph
        eastward_wind_at_surface: u_srf
        northward_wind_at_surface: v_srf
        ratio_of_wind_at_surface_adjacent_layer_to_wind_at_10m: f10m
    SOCA:
      read_from_file: 1
      date: &date 2020-12-14T21:00:00Z
      basename: ./INPUT/
      ocn_filename: MOM.res.nc
      state variables:
      - sea_water_salinity
      - sea_water_potential_temperature
      - sea_surface_height_above_geoid
      - sea_water_cell_thickness
      - eastward_sea_water_velocity
      - northward_sea_water_velocity
  background error:
    covariance model: Coupled Block Diagonal
    FV3JEDI:
      covariance model: SABER
      saber central block:
        saber block name: BUMP_NICAS
        calibration:
          general:
            universe length-scale: 5000.0e3
          io:
            files prefix: Data/var/nicas_fv3
          drivers:
            multivariate strategy: univariate
            compute nicas: true
            write local nicas: true
          nicas:
            resolution: 5
            explicit length-scales: true
            horizontal length-scale:
            - groups:
              - air_temperature
              - eastward_wind
              - northward_wind
              value: 5000.0e3
            vertical length-scale:
            - groups:
              - air_temperature
              - eastward_wind
              - northward_wind
              value: 5.0
          grids:
          - model:
              variables:
              - air_temperature
              - eastward_wind
              - northward_wind
    SOCA:
      covariance model: SABER
      saber outer blocks:
      - saber block name: StdDev
        standard deviations:
        - variable: sea_water_potential_temperature
          stddev: 5.0
        - variable: sea_water_salinity
          stddev: 2.0
      saber central block:
        saber block name: BUMP_NICAS
        calibration:
          general:
            universe length-scale: 5000.0e3
          io:
            files prefix: Data/var/nicas_soca
          drivers:
            multivariate strategy: univariate
            compute nicas: true
            write local nicas: true
          nicas:
            resolution: 5
            explicit length-scales: true
            horizontal length-scale:
            - groups:
              - sea_water_potential_temperature
              - sea_water_salinity
              value: 5000.0e3
            vertical length-scale:
            - groups:
              - sea_water_potential_temperature
              - sea_water_salinity
              value: 5.0
          grids:
          - model:
              variables:
              - sea_water_potential_temperature
              - sea_water_salinity
  observations:
    observers:
    - obs space:
        name: AMSUA-NOAA19
        obsdatain:
          engine:
            type: H5File
            obsfile: Data/obs/testinput_tier_1/amsua_n19_obs_2020121500_m.nc4
        obsdataout:
          engine:
            type: H5File
            obsfile: Data/var/amsua_n19_var_gfs_2020121500_m.nc4
        simulated variables: [brightnessTemperature]
        channels: 1-15
      obs operator:
        name: CRTM
        Absorbers: [H2O,O3]
        Clouds: [Water, Ice]
        Cloud_Fraction: 1.0
        linear obs operator:
          Absorbers: [H2O,O3]
          Clouds: [Water, Ice]
          Surfaces: [Water_Temperature]
        obs options:
          Sensor_ID: amsua_n19
          EndianType: little_endian
          CoefficientPath: Data/crtm/

variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - geometry: *geom
    ninner: 10
    gradient norm reduction: 1e-7
    test: on
    online diagnostics:
      write increment: true
      increment:
        state component:
          FV3JEDI:
            filetype: fms restart
            datapath: Data/var
            prefix: 20201214.210000.3dvar.fv3.iter1
          SOCA:
            datadir: Data/var
            date: 2020-12-14T21:00:00Z
            exp: 3dvar.soca.iter1
            type: incr

output:
  FV3JEDI:
    filetype: fms restart
    datapath: Data/var/
    type: an
    exp: 3dvar.fv3
    date: 2020-12-14T21:00:00Z
  SOCA:
    datadir: Data/var
    exp: 3dvar.soca
    type: an

test:
  reference filename: testref/var_fv3_mom6.ref
  test output filename: testoutput/var_fv3_mom6.test
