time window:
  begin: 2020-12-14T18:00:00Z
  length: PT6H
geometry:
  FV3JEDI:
    fms initialization:
      namelist filename: Data/fv3files/input_gfs_c12.nml
      field table filename: Data/fv3files/field_table_gmao
    akbk: Data/inputs/fv3files/akbk127.nc4
    npx: 13
    npy: 13
    npz: 127
  SOCA:
    mom6_input_nml: ./inputnml/input.nml
    fields metadata: ./fields_metadata.yml
  FV3JEDI exclude variables: [skin_temperature_at_surface_where_sea]

state:
  FV3JEDI:
    datetime: 2020-12-14T21:00:00Z
    filetype: fms restart
    datapath: Data/inputs/gfs_c12/bkg/
    filename_core: 20201214.210000.fv_core.res.nc
    filename_trcr: 20201214.210000.fv_tracer.res.nc
    filename_sfcd: 20201214.210000.sfc_data.nc
    filename_sfcw: 20201214.210000.fv_srf_wnd.res.nc
    filename_cplr: 20201214.210000.coupler.res
    state variables:
    - eastward_wind
    - northward_wind
    - air_temperature
    - air_pressure_thickness
    - water_vapor_mixing_ratio_wrt_moist_air
    - cloud_liquid_ice
    - cloud_liquid_water
    - ozone_mass_mixing_ratio
    - geopotential_height_times_gravity_at_surface
    - slmsk
    - sheleg
    - skin_temperature_at_surface
    - vtype
    - stype
    - vfrac
    - stc
    - soilMoistureVolumetric
    - totalSnowDepth
    - eastward_wind_at_surface
    - northward_wind_at_surface
    - f10m
    field io names:
      eastward_wind: ua
      northward_wind: va
      air_temperature: T
      air_pressure_thickness: delp
      water_vapor_mixing_ratio_wrt_moist_air: sphum
      cloud_liquid_ice: ice_wat
      cloud_liquid_water: liq_wat
      ozone_mass_mixing_ratio: o3mr
      geopotential_height_times_gravity_at_surface: phis
      skin_temperature_at_surface: tsea
      soilMoistureVolumetric: smc
      totalSnowDepth: snwdph
      eastward_wind_at_surface: u_srf
      northward_wind_at_surface: v_srf
  SOCA:
    read_from_file: 1
    date: &date 2020-12-14T21:00:00Z
    basename: ./INPUT/
    ocn_filename: MOM.res.nc
    state variables:
    - sea_water_salinity
    - sea_water_potential_temperature
    - sea_surface_height_above_geoid
    - sea_water_cell_thickness
    - eastward_sea_water_velocity
    - northward_sea_water_velocity

observations:
  observers:
  - obs space:
      name: AMSUA-NOAA19
      obsdatain:
        engine:
          type: H5File
          obsfile: Data/obs/testinput_tier_1/amsua_n19_obs_2020121500_m.nc4
      obsdataout:
        engine:
          type: H5File
          obsfile: Data/hofx/amsua_n19_hofx_gfs_2020121500_m.nc4
      simulated variables: [brightnessTemperature]
      channels: 1-15
    obs operator:
      name: CRTM
      Absorbers: [H2O,O3,CO2]
      Clouds: [Water, Ice]
      Cloud_Fraction: 1.0
      obs options:
        Sensor_ID: amsua_n19
        EndianType: little_endian
        CoefficientPath: Data/crtm/

test:
  reference filename: testref/hofx3d_fv3_mom6.ref
  test output filename: testoutput/hofx3d_fv3_mom6.test
