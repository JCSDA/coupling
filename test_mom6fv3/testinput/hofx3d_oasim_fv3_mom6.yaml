time window:
  begin: 2020-12-14T15:00:00Z
  length: PT12H
geometry:
  FV3JEDI:
    fms initialization:
      namelist filename: Data/fv3files/input_gfs_c12.nml
      field table filename: Data/fv3files/field_table_gmao
    akbk: Data/fv3files/akbk127.nc4
    npx: 13
    npy: 13
    npz: 127
  SOCA:
    mom6_input_nml: ./inputnml/input.nml
    fields metadata: ./fields_metadata.yml
  FV3JEDI exclude variables: [skin_temperature_at_surface_where_sea]

state:
  FV3JEDI:
    datetime: 2020-12-14T21:00:00Z
    filetype: fms restart
    datapath: Data/inputs/gfs_c12/bkg/
    filename_core: 20201214.210000.fv_core.res.nc
    filename_trcr: 20201214.210000.fv_tracer.res.nc
    filename_sfcd: 20201214.210000.sfc_data.nc
    filename_sfcw: 20201214.210000.fv_srf_wnd.res.nc
    filename_cplr: 20201214.210000.coupler.res
    state variables: [ua,va,T,delp,sphum,ice_wat,liq_wat,o3mr,phis,
                      slmsk,sheleg,tsea,vtype,stype,vfrac,stc,smc,snwdph,
                      u_srf,v_srf,f10m]
  SOCA:
    read_from_file: 1
    date: &date 2020-12-14T21:00:00Z
    basename: ./INPUT/
    ocn_filename: MOM.res.nc
    bio_filename: NOBM.res.nc
    state variables:
    - sea_water_cell_thickness
    - ozone_thickness
    - water_vapor
    - wind_speed_at_surface
    - air_pressure_at_surface
    - relative_humidity
    - cloud_liquid_water_path
    - cloud_area_fraction_in_atmosphere_layer
    - aerosol_optical_thickness
    - single_scattering_albedo
    - asymmetry_parameter
    - Carbon_nitrogen_detritus_concentration
    - Particulate_inorganic_carbon
    - colored_dissolved_organic_carbon
    - diatom_concentration
    - chlorophyte_concentration
    - cyano-bacteria_concentration
    - coccolithophore_concentration
    - dinoflagellate_concentration
    - phaeocystis_concentration

observations:
  observers:
  - obs space:
      name: Radiance
      obsdatain:
        engine:
          type: H5File
          obsfile: Data/obs/testinput_tier_1/modis_aqua_oc_obs_20201215_m.nc
      obsdataout:
        engine:
          type: H5File
          obsfile: Data/hofx/modis_aqua_oc_hofx_gfs_20201215_m.nc
      simulated variables: [radiance]
      channels: 1-10
    obs operator:
      name: OASIM
      CoefficientPath: data_static/oasim

test:
  reference filename: testref/hofx3d_oasim_fv3_mom6.ref
  test output filename: testoutput/hofx3d_oasim_fv3_mom6.test
