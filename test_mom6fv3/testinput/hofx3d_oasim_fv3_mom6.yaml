    - chlorophyte_concentration
    - cyano-bacteria_concentration
    - coccolithophore_concentration
    - dinoflagellate_concentration
    - phaeocystis_concentration

observations:
  observers:
  - obs space:
      name: Radiance
      obsdatain:
        engine:
          type: H5File
          obsfile: Data/obs/testinput_tier_1/modis_aqua_oc_obs_20201215_m.nc
      obsdataout:
        engine:
          type: H5File
          obsfile: Data/hofx/modis_aqua_oc_hofx_gfs_20201215_m.nc
      simulated variables: [radiance]
      channels: 1-10
    obs operator:
      name: OASIM
      CoefficientPath: data_static/oasim

test:
  reference filename: testref/hofx3d_oasim_fv3_mom6.ref
  test output filename: testoutput/hofx3d_oasim_fv3_mom6.test
